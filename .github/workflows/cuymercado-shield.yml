name: CuyMercado · Escudo
on:
  push:
    branches: [main]
    paths: ['etl/update_shield.py', 'tests/test_shield.py', 'data-input/shield/reviewed.json', '.github/workflows/cuymercado-shield.yml']
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cuymercado-public-data
  cancel-in-progress: false
jobs:
  shield:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validar extracción y estados de Escudo
        run: python -m unittest discover -s tests -v
      - name: Revisar publicaciones públicas de MINSA
        if: github.event_name != 'push'
        run: python etl/update_shield.py
      - name: Validar integridad del paquete
        run: python etl/update_shield.py --build-only
      - name: Publicar alertas y noticias verificadas
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shield data-input/shield/current-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar monitor sanitario de MINSA'
            git push origin HEAD:main
          fi
      - name: Documentar alcance de la revisión diaria
        if: github.event_name != 'push'
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('data-input/shield/current-data.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write(f"## Escudo\n\nConsulta MINSA: {d['checkedAt']}. {len(d['news'])} noticias alimentarias; {len(d['alerts'])} comunicados revisados.\n\nRevisión editorial de comunicados: {d['reviewedAt']}. La consulta diaria no renueva esta fecha ni acredita vigencia de medidas. DIGESA e INDECOPI se consultan interactivamente, sin APIs privadas.\n")
          PY
