name: CuyMercado · precios públicos
on:
  push:
    branches: [main]
    paths: ['etl/**', 'tests/**', 'requirements.txt', '.github/workflows/cuymercado-data.yml']
  schedule:
    # MIDAGRI uploads the GMML report between about 09:00 and 15:00 in Lima: 09:00, 13:00 and 16:30 Lima (UTC-5).
    - cron: '0 14 * * *'
    - cron: '0 18 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: Runner de GitHub (macOS usa otra red si gob.pe no responde a Ubuntu)
        type: choice
        options: [ubuntu-24.04, macos-latest]
        default: ubuntu-24.04
      deploy_cloudflare:
        description: Desplegar además en un proyecto Cloudflare existente
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cuymercado-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Pruebas de extracción, integridad y acceso de esta fuente
        # Only this feed's tests: a failure in another feed must not stop this one.
        run: for p in test_access.py test_backfill.py test_daily.py test_pipeline.py; do python -m unittest discover -s tests -p "$p" -v; done
      - name: Pruebas de todas las fuentes al cambiar el código
        if: github.event_name == 'push'
        run: python -m unittest discover -s tests -v
      - name: Consultar MIDAGRI y recuperar fechas intermedias
        if: github.event_name != 'push'
        run: python etl/update_daily.py
      - name: Preparar datos públicos versionados
        run: python etl/build_release.py
      - name: Publicar solo datos validados y conservar versiones
        if: github.event_name != 'push'
        run: |
          cp -R dist/releases .
          cp dist/current.json dist/_headers .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases current.json _headers data-input
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar precios públicos verificados de MIDAGRI'
            # Another feed may have published meanwhile: they touch separate folders, so rebase and retry.
            for attempt in 1 2 3; do
              git pull --rebase --quiet origin main && git push origin HEAD:main && break
              test "$attempt" = 3 && exit 1
              sleep 10
            done
          fi
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflare
        with:
          node-version: '22'
      - name: Exportar exclusivamente los archivos de distribución
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflare
        run: |
          mkdir -p cloudflare-dist
          cp -R releases current.json _headers cloudflare-dist/
      - name: Desplegar en proyecto Cloudflare existente
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CUY_DATA_PAGES_PROJECT }}
        run: |
          test -n "$PROJECT"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler@4 pages deploy cloudflare-dist --project-name "$PROJECT" --branch main
