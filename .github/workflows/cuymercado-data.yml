name: CuyMercado · precios públicos
on:
  push:
    branches: [main]
    paths: ['etl/**', 'tests/**', 'requirements.txt', '.github/workflows/cuymercado-data.yml']
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      deploy_cloudflare:
        description: Desplegar además en un proyecto Cloudflare existente
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cuymercado-public-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Pruebas de extracción, integridad y acceso
        run: python -m unittest discover -s tests -v
      - name: Consultar MIDAGRI y recuperar fechas intermedias
        if: github.event_name != 'push'
        run: python etl/update_daily.py
      - name: Preparar datos públicos versionados
        run: python etl/build_release.py
      - name: Publicar solo datos validados y conservar versiones
        if: github.event_name != 'push'
        run: |
          cp -R dist/releases .
          cp dist/current.json dist/_headers .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases current.json _headers data-input
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar precios públicos verificados de MIDAGRI'
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflare
        with:
          node-version: '22'
      - name: Exportar exclusivamente los archivos de distribución
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflare
        run: |
          mkdir -p cloudflare-dist
          cp -R releases current.json _headers cloudflare-dist/
      - name: Desplegar en proyecto Cloudflare existente
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CUY_DATA_PAGES_PROJECT }}
        run: |
          test -n "$PROJECT"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler@4 pages deploy cloudflare-dist --project-name "$PROJECT" --branch main
