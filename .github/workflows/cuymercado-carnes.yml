name: CuyMercado · Carnes
on:
  push:
    branches: [main]
    paths: ['etl/carnes_sources.py', 'etl/update_carnes.py', 'tests/test_carnes.py', '.github/workflows/cuymercado-carnes.yml']
  schedule:
    # The MIDAGRI bulletin is published on working days; 15:30 UTC is 10:30 in Lima.
    - cron: '30 15 * * 1-6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cuymercado-public-data
  cancel-in-progress: false
jobs:
  carnes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validar extracción, integridad y aislamiento de fuentes
        run: python -m unittest discover -s tests -v
      - name: Consultar el boletín diario de aves de MIDAGRI
        if: github.event_name != 'push'
        run: python etl/update_carnes.py --months 2
      - name: Validar paquete de carnes
        run: python etl/update_carnes.py --build-only
      - name: Publicar el paquete verificado de carnes
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add carnes data-input/carnes
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar precios de aves y pescado del boletín diario de MIDAGRI'
            git push origin HEAD:main
          fi
